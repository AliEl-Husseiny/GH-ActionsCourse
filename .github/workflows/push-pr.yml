name: Push-PR Workflow
on: 
    push:
        branches:
            - main
            - "release/**"
        paths:
            - "src/**"
        paths-ignore:
            - "docs/**"
            - "tests/**"
    pull_request:
        branches:
            - main
            - "release/**"
        paths:
            - "src/**"
        paths-ignore:
            - "docs/**"
            - "tests/**"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7.0.1 
        - name: Run tests
          run: npm test
        

    