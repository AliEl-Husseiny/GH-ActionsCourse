on:
  workflow_dispatch:
jobs:
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command in Ubuntu VM
        run: echo "This runs on the Ubuntu VM"

      - name: Run inside an Alpine container
        uses: docker://alpine:latest #The image must be accessible without authenticaiton on Docker Hub
        with:
          entrypoint: /bin/sh
          args: |
            -c "echo 'This runs inside an Alpine container'"

      - name: Run another command in Ubuntu VM
        run: echo "This runs on the Ubuntu VM again"

  dockerized_job:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/my-org/myprivate-image:latest
      credentials:
        username: ${{ secrets.Docker_USERNAME }}
        password: ${{ secrets.Docker_PASSWORD }}
    steps:
      - run: node --version
      - run: echo "This whole job runs inside a Node.js container"
