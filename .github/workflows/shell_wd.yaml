name: More Complex Workflow
on:
  workflow_dispatch:
jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: install and build
        run: |
          echo "Installing dependencies..."
          npm install
          echo "Building the project..."
          npm run build
        working-directory: ./src
        shell: bash # python, bash, sh, pwsh, cmd, powershell, etc.
      - run: print %ENV #perl line to print environment variables
        shell: perl {0}
