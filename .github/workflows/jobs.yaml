on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Run Job 1
        run: echo "Job 1 executed"
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Run Job 2
        run: echo "Job 2 executed after Job 1"

  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Run Job 3
        run: echo "Job 3 executed after Job 2"

  job_4:
    runs-on: ubuntu-latest
    needs: [job_2, job_3]
    steps:
      - name: Run Job 4
        run: echo "Job 4 executed after Job 2 and Job 3"
